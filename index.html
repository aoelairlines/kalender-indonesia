<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App + Mini Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        #taskInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
        }
        #addBtn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        #addBtn:hover { background: #5568d3; }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .filter-btn {
            flex: 1;
            padding: 8px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        #taskList {
            list-style: none;
            margin-bottom: 20px;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .task-item:hover { transform: translateX(5px); }
        .task-item.completed {
            background: #d4edda;
            text-decoration: line-through;
            opacity: 0.8;
        }
        .task-item input[type="checkbox"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .task-text { flex: 1; }
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { background: #c82333; }
        .stats {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
            color: #666;
        }
        #gameSection {
            display: none;
            text-align: center;
        }
        #gameSection h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        #gameCanvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            background: #1a1a2e;
            display: block;
            margin: 0 auto 15px;
        }
        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .game-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .game-btn:hover { background: #5568d3; }
        .mobile-controls {
            display: none;
            margin-top: 15px;
        }
        .mobile-controls button {
            padding: 15px;
            font-size: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        @media (max-width: 600px) {
            .mobile-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo App</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Tambah tugas baru...">
            <button id="addBtn">Tambah</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="active">Aktif</button>
            <button class="filter-btn" data-filter="completed">Selesai</button>
        </div>

        <div class="stats" id="stats">0 tugas aktif</div>

        <ul id="taskList"></ul>

        <div id="gameSection">
            <h2>🎮 Selamat! 🎉</h2>
            <p style="margin-bottom: 15px; color: #666;">Semua tugas selesai! Main game dulu:</p>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-controls">
                <button class="game-btn" id="startGameBtn">Mulai Game</button>
                <button class="game-btn" id="resetGameBtn">Reset</button>
            </div>
            <div class="mobile-controls">
                <div></div>
                <button id="upBtn">↑</button>
                <div></div>
                <button id="leftBtn">←</button>
                <button id="downBtn">↓</button>
                <button id="rightBtn">→</button>
            </div>
            <p style="margin-top: 10px; color: #666;">Skor: <span id="score">0</span></p>
        </div>
    </div>

    <script>
        (function() {
            const taskInput = document.getElementById('taskInput');
            const addBtn = document.getElementById('addBtn');
            const taskList = document.getElementById('taskList');
            const stats = document.getElementById('stats');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const gameSection = document.getElementById('gameSection');

            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let currentFilter = 'all';

            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            function renderTasks() {
                taskList.innerHTML = '';
                const filtered = tasks.filter(t => {
                    if (currentFilter === 'active') return !t.completed;
                    if (currentFilter === 'completed') return t.completed;
                    return true;
                });

                filtered.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = 'task-item' + (task.completed ? ' completed' : '');
                    li.innerHTML = `
                        <input type="checkbox" ${task.completed ? 'checked' : ''} data-index="${index}">
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <button class="delete-btn" data-index="${index}">Hapus</button>
                    `;
                    taskList.appendChild(li);
                });

                const activeCount = tasks.filter(t => !t.completed).length;
                stats.textContent = `${activeCount} tugas aktif`;

                if (tasks.length > 0 && tasks.every(t => t.completed)) {
                    gameSection.style.display = 'block';
                } else {
                    gameSection.style.display = 'none';
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            addBtn.addEventListener('click', () => {
                const text = taskInput.value.trim();
                if (!text) return alert('Masukkan tugas!');
                tasks.push({ text, completed: false });
                saveTasks();
                taskInput.value = '';
                renderTasks();
            });

            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addBtn.click();
            });

            taskList.addEventListener('click', (e) => {
                if (e.target.type === 'checkbox') {
                    const idx = parseInt(e.target.dataset.index);
                    tasks[idx].completed = e.target.checked;
                    saveTasks();
                    renderTasks();
                }
                if (e.target.classList.contains('delete-btn')) {
                    const idx = parseInt(e.target.dataset.index);
                    tasks.splice(idx, 1);
                    saveTasks();
                    renderTasks();
                }
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });

            // Snake Game
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startGameBtn = document.getElementById('startGameBtn');
            const resetGameBtn = document.getElementById('resetGameBtn');
            const scoreDisplay = document.getElementById('score');

            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            let snake = [{ x: 10, y: 10 }];
            let direction = { x: 1, y: 0 };
            let food = { x: 15, y: 15 };
            let score = 0;
            let gameLoop = null;
            let gameRunning = false;

            function drawGame() {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#4ecca3';
                snake.forEach(segment => {
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                });

                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

                scoreDisplay.textContent = score;
            }

            function updateGame() {
                const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }

                if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    gameOver();
                    return;
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    food = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                } else {
                    snake.pop();
                }

                drawGame();
            }

            function gameOver() {
                clearInterval(gameLoop);
                gameRunning = false;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Skor: ' + score, canvas.width / 2, canvas.height / 2 + 30);
            }

            function startGame() {
                if (gameRunning) return;
                snake = [{ x: 10, y: 10 }];
                direction = { x: 1, y: 0 };
                score = 0;
                food = { x: 15, y: 15 };
                gameRunning = true;
                drawGame();
                gameLoop = setInterval(updateGame, 150);
            }

            function resetGame() {
                clearInterval(gameLoop);
                gameRunning = false;
                snake = [{ x: 10, y: 10 }];
                direction = { x: 1, y: 0 };
                score = 0;
                food = { x: 15, y: 15 };
                drawGame();
            }

            startGameBtn.addEventListener('click', startGame);
            resetGameBtn.addEventListener('click', resetGame);

            document.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                switch(e.key) {
                    case 'ArrowUp': if (direction.y === 0) direction = { x: 0, y: -1 }; break;
                    case 'ArrowDown': if (direction.y === 0) direction = { x: 0, y: 1 }; break;
                    case 'ArrowLeft': if (direction.x === 0) direction = { x: -1, y: 0 }; break;
                    case 'ArrowRight': if (direction.x === 0) direction = { x: 1, y: 0 }; break;
                }
            });

            document.getElementById('upBtn').addEventListener('click', () => { if (gameRunning && direction.y === 0) direction = { x: 0, y: -1 }; });
            document.getElementById('downBtn').addEventListener('click', () => { if (gameRunning && direction.y === 0) direction = { x: 0, y: 1 }; });
            document.getElementById('leftBtn').addEventListener('click', () => { if (gameRunning && direction.x === 0) direction = { x: -1, y: 0 }; });
            document.getElementById('rightBtn').addEventListener('click', () => { if (gameRunning && direction.x === 0) direction = { x: 1, y: 0 }; });

            drawGame();
            renderTasks();
        })();
    </script>
</body>
</html>
