<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Special Day</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
  body { background: #f5f3ef; min-height: 100vh; padding: 24px; display: flex; justify-content: center; background-image: repeating-linear-gradient(90deg, transparent 0 28px, rgba(120,140,160,0.12) 28px 29px), repeating-linear-gradient(90deg, transparent 0 58px, rgba(120,140,160,0.18) 58px 59px), radial-gradient(circle at 14px 14px, rgba(120,140,160,0.22) 1.5px, transparent 2px), radial-gradient(circle at 43px 28px, rgba(120,140,160,0.18) 1.5px, transparent 2px), radial-gradient(circle at 73px 42px, rgba(120,140,160,0.22) 1.5px, transparent 2px), radial-gradient(circle at 14px 56px, rgba(120,140,160,0.18) 1.5px, transparent 2px), radial-gradient(circle at 43px 70px, rgba(120,140,160,0.22) 1.5px, transparent 2px); background-size: 58px 84px, 116px 84px, 58px 84px, 116px 84px, 58px 84px, 58px 84px, 116px 84px; }
  .wrap { width: 100%; max-width: 960px; background: rgba(255,255,255,0.85); border-radius: 24px; padding: 28px; border: 4px solid #7a8a9a; box-shadow: 0 8px 24px rgba(120,140,160,0.15); position: relative; backdrop-filter: blur(4px); }
  .wrap::before, .wrap::after { content: '❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀'; display: block; text-align: center; color: #7a8a9a; font-size: 0.85rem; letter-spacing: 4px; margin: 6px 0; }
  .wrap::after { content: '❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀ ❀'; }
  .title-area { text-align: center; margin: 18px 0 14px; }
  .title-area h1 { font-family: 'Dancing Script', cursive; font-size: 2.6rem; font-weight: 700; color: #3d4f5f; text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(120,140,160,0.3); letter-spacing: 1px; }
  .title-area .subtitle { font-family: 'Dancing Script', cursive; font-size: 1.1rem; color: #7a8a9a; font-weight: 600; margin-top: 2px; letter-spacing: 0.5px; }
  .announce { background: #fff; border: 2px solid #7a8a9a; border-radius: 16px; padding: 18px; margin-bottom: 18px; text-align: center; position: relative; }
  .announce.empty { opacity: 0.6; border-style: dashed; }
  .announce h2 { font-family: 'Dancing Script', cursive; font-size: 1.3rem; color: #3d4f5f; margin-bottom: 6px; font-weight: 700; }
  .announce .note-text { color: #3d4f5f; font-size: 1.1rem; line-height: 1.5; font-weight: 600; }
  .announce .note-meta { color: #7a8a9a; font-size: 0.85rem; margin-top: 6px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #7a8a9a; color: #fff; padding: 12px 18px; border-radius: 14px; margin-bottom: 14px; border: 2px solid #6b7a8a; }
  .header button { background: #fff; border: 2px solid #6b7a8a; color: #3d4f5f; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 700; font-family: 'Quicksand', sans-serif; transition: 0.2s; }
  .header button:hover { background: #e8edf2; transform: scale(1.05); }
  .header .month-label { font-size: 1.1rem; font-weight: 700; font-family: 'Dancing Script', cursive; letter-spacing: 0.5px; }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .weekdays div { text-align: center; padding: 10px 4px; font-weight: 700; color: #3d4f5f; font-size: 0.8rem; text-transform: lowercase; letter-spacing: 0.5px; }
  .day { background: #fff; min-height: 90px; padding: 8px; border-radius: 16px; position: relative; cursor: pointer; border: 2.5px solid #b0bec5; transition: 0.2s; box-shadow: 0 2px 4px rgba(120,140,160,0.08); }
  .day:hover { background: #e8edf2; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(120,140,160,0.12); }
  .day.today { background: #fff9c4; border-color: #b0a000; }
  .day.holiday { background: #fce8e8; }
  .day.has-note { background: #e8f0e8; }
  .day .num { font-weight: 700; font-size: 0.95rem; color: #3d4f5f; }
  .day .tag { font-size: 0.62rem; margin-top: 4px; color: #7a3d3d; word-break: break-word; line-height: 1.2; font-weight: 600; }
  .day .note-preview { font-size: 0.62rem; margin-top: 3px; color: #4a6b4a; word-break: break-word; font-weight: 700; line-height: 1.2; }
  .day .today-badge { position: absolute; top: 5px; right: 5px; background: #b0a000; color: white; font-size: 0.55rem; padding: 2px 6px; border-radius: 10px; font-weight: 700; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(61,79,95,0.45); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; padding: 24px; border-radius: 20px; width: 90%; max-width: 420px; border: 3px solid #7a8a9a; box-shadow: 0 8px 24px rgba(120,140,160,0.2); }
  .modal h3 { margin-bottom: 12px; color: #3d4f5f; font-family: 'Dancing Script', cursive; font-size: 1.5rem; font-weight: 700; }
  .modal textarea { width: 100%; padding: 12px; margin-bottom: 14px; border: 2px solid #b0bec5; border-radius: 12px; resize: vertical; min-height: 90px; font-family: 'Quicksand', sans-serif; font-size: 0.95rem; background: #f5f3ef; }
  .modal textarea:focus { outline: none; background: #fff9c4; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal button { padding: 8px 18px; border: 2px solid #7a8a9a; border-radius: 20px; cursor: pointer; font-weight: 700; font-family: 'Quicksand', sans-serif; transition: 0.2s; }
  .modal .save { background: #7a8a9a; color: #fff; }
  .modal .save:hover { background: #6b7a8a; transform: scale(1.05); }
  .modal .cancel { background: #fff; color: #3d4f5f; }
  .modal .cancel:hover { background: #e8edf2; }
  .modal .delete { background: #fff; color: #c62828; border-color: #c62828; }
  .modal .delete:hover { background: #fce8e8; }
  .legend { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; font-size: 0.8rem; color: #3d4f5f; font-weight: 600; justify-content: center; }
  .legend span { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 5px; border: 1.5px solid #7a8a9a; }
  @media (max-width: 640px) {
    .day { min-height: 55px; padding: 5px; border-radius: 10px; }
    .day .tag, .day .note-preview { font-size: 0.55rem; }
    .header { padding: 10px 12px; }
    .wrap { padding: 16px; }
    .title-area h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-area">
    <h1>calendar</h1>
    <div class="subtitle">noted your special day</div>
  </div>

  <div class="announce" id="announce">
    <h2>📢 Today</h2>
    <div id="announceContent">No note for today yet.</div>
  </div>

  <div class="header">
    <button id="prev">◀</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="next">▶</button>
  </div>

  <div class="weekdays">
    <div>sun</div><div>mon</div><div>tue</div><div>wed</div><div>thu</div><div>fri</div><div>sat</div>
  </div>
  <div class="days" id="days"></div>

  <div class="legend">
    <div><span style="background:#ffebee"></span>Holiday</div>
    <div><span style="background:#f3e5f5"></span>Has Note</div>
    <div><span style="background:#fff9c4;border-color:#f57f17"></span>Today</div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Note</h3>
    <textarea id="noteInput" placeholder="Write your note here..."></textarea>
    <div class="actions">
      <button class="delete" id="deleteBtn" style="display:none">Delete</button>
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
const holidays = {
  '01-01': 'New Year',
  '01-07': 'Nyepi',
  '02-14': 'Valentine',
  '03-08': "Women's Day",
  '04-22': 'Earth Day',
  '05-01': 'Labor Day',
  '05-02': 'Heroes Day',
  '06-01': 'Pancasila Day',
  '08-17': 'Independence Day',
  '10-02': 'Batik Day',
  '10-05': "Santri Day",
  '10-10': 'Pancasila Day',
  '11-10': 'Heroes Day',
  '12-22': "Mother's Day",
  '12-25': 'Christmas'
};
const indoMonths = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let current = new Date();
let notes = JSON.parse(localStorage.getItem('calendarNotes') || '{}');
let selectedDate = null;

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dateKeyShort(d){ return pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function renderAnnounce(){
  const today = new Date();
  const key = dateKey(today);
  const note = notes[key];
  const el = document.getElementById('announce');
  const content = document.getElementById('announceContent');
  if(note){
    el.classList.remove('empty');
    content.innerHTML = `<div class="note-text">"${escapeHtml(note)}"</div><div class="note-meta">${indoMonths[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}</div>`;
  } else {
    el.classList.add('empty');
    content.textContent = 'No note for today yet.';
  }
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function render(){
  const y = current.getFullYear(), m = current.getMonth();
  document.getElementById('monthLabel').innerText = indoMonths[m] + ' ' + y;
  const first = new Date(y,m,1);
  const startDay = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = new Date();
  let html = '';
  for(let i=0;i<startDay;i++) html += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dt = new Date(y,m,d);
    const key = dateKey(dt);
    const shortKey = dateKeyShort(dt);
    const isToday = dt.toDateString() === today.toDateString();
    const hol = holidays[shortKey];
    const note = notes[key];
    let cls = 'day';
    if(hol) cls += ' holiday';
    if(note) cls += ' has-note';
    if(isToday) cls += ' today';

    let inner = `<div class="num">${d}</div>`;
    if(isToday) inner += '<div class="today-badge">TODAY</div>';
    if(hol) inner += `<div class="tag">${hol}</div>`;
    if(note) inner += `<div class="note-preview">✎ ${escapeHtml(note.substring(0,30))}${note.length>30?'...':''}</div>`;

    html += `<div class="${cls}" onclick="openModal(${y},${m},${d})">${inner}</div>`;
  }
  document.getElementById('days').innerHTML = html;
  renderAnnounce();
}

function openModal(y,m,d){
  const dt = new Date(y,m,d);
  selectedDate = dateKey(dt);
  const note = notes[selectedDate] || '';
  document.getElementById('modalTitle').innerText = 'Note - '+pad(d)+' '+indoMonths[m]+' '+y;
  document.getElementById('noteInput').value = note;
  document.getElementById('deleteBtn').style.display = note ? 'inline-block' : 'none';
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('noteInput').focus(), 100);
}

function saveNote(){
  const val = document.getElementById('noteInput').value.trim();
  if(val){ notes[selectedDate] = val; }
  else { delete notes[selectedDate]; }
  localStorage.setItem('calendarNotes', JSON.stringify(notes));
  closeModal();
  render();
}

function deleteNote(){
  delete notes[selectedDate];
  localStorage.setItem('calendarNotes', JSON.stringify(notes));
  closeModal();
  render();
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  selectedDate = null;
}

document.getElementById('prev').onclick = ()=>{ current.setMonth(current.getMonth()-1); render(); };
document.getElementById('next').onclick = ()=>{ current.setMonth(current.getMonth()+1); render(); };
document.getElementById('saveBtn').onclick = saveNote;
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('deleteBtn').onclick = deleteNote;
document.getElementById('modal').onclick = (e)=>{ if(e.target.id==='modal') closeModal(); };

render();
</script>
</body>
</html>
